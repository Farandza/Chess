name: chess
description: A simple real-time multiplayer chess client.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.5.3
  bishop: ^1.4.4
  squares: ^1.2.1
  square_bishop: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
